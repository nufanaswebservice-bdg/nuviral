server {
    listen 80;
    server_name nuviral.cloud www.nuviral.cloud;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nuviral.cloud www.nuviral.cloud;

    # SSL certificates (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/nuviral.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuviral.cloud/privkey.pem;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API - route /api/v1/* to backend container
    location /api/v1/ {
        proxy_pass http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Important for webhooks - no timeout
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Frontend - everything else goes to Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
